[project]
name = "egyptian-national-id-ocr"
version = "0.2.0"
description = "Fast, local, open-source Egyptian National ID OCR extraction pipeline"
readme = "README.md"
authors = [{ name = "Hassan Salama" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless",
    "pytesseract",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-multipart",
    "typer",
    "rich",
    "pillow",
    # digit_classifier_engine.py: HOG features (scikit-image) + the
    # trained SVM (scikit-learn, loaded via joblib) for national_id/
    # serial_number/birth_date - a core part of the pipeline now, not
    # just training tooling.
    "scikit-image",
    "scikit-learn",
    "joblib",
    # paddle_ocr_engine.py: the default engine for name/address (see
    # that module's docstring for why - faster and more accurate than
    # EasyOCR here, once configured with enable_mkldnn=False).
    "paddlepaddle",
    "paddleocr",
]

[project.optional-dependencies]
# MCP server (egy-nid-ocr-mcp), exposing the pipeline as tools an AI
# assistant can call. Optional because the OCR pipeline, HTTP API and CLI
# all work without it.
mcp = [
    "mcp>=2.0",
]
# Synthetic data generation + model training/benchmarking tooling.
# Not required to run the OCR pipeline itself.
training = [
    "arabic_reshaper",
    "python-bidi",
    "tqdm",
]
# EasyOCR (PyTorch) is no longer the default engine (see
# paddle_ocr_engine.py) - kept only for the benchmark/comparison
# scripts under tests/ and scripts/ that reference EasyOCREngine
# directly. Not needed to run the pipeline itself.
legacy-ocr = [
    "easyocr",
]

[project.scripts]
egy-nid-ocr = "egyptian_national_id_ocr.cli:app"
egy-nid-ocr-mcp = "egyptian_national_id_ocr.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py files the package needs AT RUNTIME, not just for development -
# setuptools' default file-finder only collects .py files, so without
# this the trained digit classifier and the card-detection templates are
# silently left out of the wheel. Confirmed by building a wheel and
# listing its contents: neither was present, so a fresh `pip install`
# raised "Digit classifier model not found" on the first scan attempt -
# every numeric field (national_id, serial_number, both dates) would
# have failed for every user, while the package appeared to install
# successfully. This is the one packaging config that gets tested
# directly (see tests/test_packaging.py): building a wheel and installing
# it into a clean venv with no source tree available.
[tool.setuptools.package-data]
egyptian_national_id_ocr = [
    "ocr/models/*.joblib",
    "detection/templates/*.jpg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
