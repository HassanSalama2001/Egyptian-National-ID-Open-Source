[project]
name = "egyptian-national-id-ocr"
version = "0.3.0"
description = "Fast, local, open-source Egyptian National ID OCR extraction pipeline"
readme = "README.md"
authors = [{ name = "Hassan Salama" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "ocr",
    "egyptian-national-id",
    "id-card",
    "arabic-ocr",
    "computer-vision",
    "document-extraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "opencv-python-headless",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-multipart",
    "typer",
    "rich",
    "pillow",
    # digit_classifier_engine.py: HOG features (scikit-image) + the
    # trained SVM (scikit-learn, loaded via joblib) for national_id/
    # serial_number/birth_date - a core part of the pipeline now, not
    # just training tooling.
    "scikit-image",
    "scikit-learn",
    "joblib",
    # paddle_ocr_engine.py: the default engine for name/address (see
    # that module's docstring for why - faster and more accurate than
    # EasyOCR here, once configured with enable_mkldnn=False).
    "paddlepaddle",
    "paddleocr",
]

[project.optional-dependencies]
# Everything `pytest tests` itself needs to even COLLECT the suite -
# httpx is required by fastapi/starlette's TestClient (tests/
# test_api_hardening.py), and pytest was, until CI caught it, not
# declared anywhere at all: it only ran locally because a dev venv had
# it installed ad hoc, outside pyproject.toml. CI's first real run
# failed on exactly this ("No module named pytest") - this extra exists
# so that failure mode can't happen again for anyone else, including a
# future CI job that only installs "the package" and expects tests to
# be runnable.
test = [
    "pytest",
    "httpx",
]
# MCP server (egy-nid-ocr-mcp), exposing the pipeline as tools an AI
# assistant can call. Optional because the OCR pipeline, HTTP API and CLI
# all work without it.
mcp = [
    "mcp>=2.0",
]
# Synthetic data generation + model training/benchmarking tooling.
# Not required to run the OCR pipeline itself.
training = [
    "arabic_reshaper",
    "python-bidi",
    "tqdm",
]
# EasyOCR (PyTorch) and Tesseract are not the default engine (see
# paddle_ocr_engine.py) - kept only for TesseractEngine/EasyOCREngine,
# which nothing in the pipeline imports by default (confirmed: grepping
# the package for TesseractEngine/tesseract_engine turns up nothing
# outside this file and a comment). Not needed to run the pipeline
# itself - `egy-nid-ocr doctor` checks for the tesseract system BINARY
# separately (shutil.which), which is unaffected by whether this Python
# package is installed.
legacy-ocr = [
    "easyocr",
    "pytesseract",
]

[project.urls]
Homepage = "https://github.com/HassanSalama2001/Egyptian-National-ID-Open-Source"
Repository = "https://github.com/HassanSalama2001/Egyptian-National-ID-Open-Source"
Issues = "https://github.com/HassanSalama2001/Egyptian-National-ID-Open-Source/issues"
Changelog = "https://github.com/HassanSalama2001/Egyptian-National-ID-Open-Source/blob/main/CHANGELOG.md"

[project.scripts]
egy-nid-ocr = "egyptian_national_id_ocr.cli:app"
egy-nid-ocr-mcp = "egyptian_national_id_ocr.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py files the package needs AT RUNTIME, not just for development -
# setuptools' default file-finder only collects .py files, so without
# this the trained digit classifier and the card-detection templates are
# silently left out of the wheel. Confirmed by building a wheel and
# listing its contents: neither was present, so a fresh `pip install`
# raised "Digit classifier model not found" on the first scan attempt -
# every numeric field (national_id, serial_number, both dates) would
# have failed for every user, while the package appeared to install
# successfully. This is the one packaging config that gets tested
# directly (see tests/test_packaging.py): building a wheel and installing
# it into a clean venv with no source tree available.
[tool.setuptools.package-data]
egyptian_national_id_ocr = [
    "ocr/models/*.joblib",
    "detection/templates/*.jpg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
